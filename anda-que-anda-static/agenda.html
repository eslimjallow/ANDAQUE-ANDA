    <main class="mx-auto max-w-6xl px-4 py-10">
      <header class="space-y-2">
        <h1 class="font-serif text-3xl font-semibold text-ink md:text-4xl">Agenda</h1>
        <p class="max-w-2xl text-sm leading-relaxed text-ink/70 md:text-base">
          Próximos eventos. Diseñado para móvil: ubicación y hora siempre visibles.
        </p>
      </header>

      <section id="agenda-list" class="mt-8 space-y-4" aria-live="polite"></section>
    </main>

    <footer class="border-t border-black/10 bg-white">
      <div class="mx-auto max-w-6xl px-4 py-10 text-sm text-ink/70">
        © <span id="year"></span> ANDA QUE ANDA · <a class="font-semibold text-stage-red" href="./contact.html">Contacto</a>
      </div>
    </footer>

    <a
      href="https://wa.me/393357150090?text=Hola%20ANDA%20QUE%20ANDA.%20Me%20gustar%C3%ADa%20pedir%20informaci%C3%B3n%20de%20pr%C3%B3ximas%20funciones."
      target="_blank"
      rel="noreferrer"
      class="fixed bottom-5 right-5 z-50 inline-flex items-center gap-2 rounded-full bg-stage-red px-4 py-3 text-sm font-semibold text-white shadow-lg shadow-stage-red/20 transition hover:brightness-110"
      aria-label="Reservas por WhatsApp"
      title="Reservas por WhatsApp"
      >WhatsApp</a
    >

    <script src="./events.js"></script>
    <script>
      document.getElementById('year').textContent = String(new Date().getFullYear())

      ;(function () {
        var list = document.getElementById('agenda-list')
        if (!list || !window.AQA_EVENTS) return

        function esc(s) {
          var d = document.createElement('div')
          d.textContent = s == null ? '' : String(s)
          return d.innerHTML
        }

        function renderEvent(evt, past) {
          var article = document.createElement('article')
          article.className =
            'rounded-2xl border p-5 ' +
            (past
              ? 'border-ink/15 bg-mist/40 opacity-80'
              : 'border-black/10 bg-white hover:border-stage-red/25')
          article.setAttribute('data-event-iso', evt.iso)

          var timeHtml = evt.time
            ? '<span class="text-ink/35" aria-hidden="true">·</span><span class="font-semibold text-ink">' +
              esc(evt.time) +
              '</span>'
            : ''
          var subtitleHtml = evt.subtitle
            ? '<p class="mt-1 text-sm text-ink/70">' + esc(evt.subtitle) + '</p>'
            : ''
          var pastBadge = past
            ? '<span class="mb-2 inline-flex rounded-full bg-ink/10 px-2.5 py-0.5 text-xs font-semibold uppercase tracking-wide text-ink/60">Evento pasado</span>'
            : ''
          var noteHtml = evt.note
            ? '<p class="mt-2 text-sm text-ink/70">' + esc(evt.note) + '</p>'
            : ''
          var dotClass = past ? 'bg-ink/30' : 'bg-stage-red'

          article.innerHTML =
            pastBadge +
            '<div class="flex flex-wrap items-start justify-between gap-3">' +
            '<div><div class="text-lg font-semibold text-ink">' +
            esc(evt.title) +
            '</div>' +
            subtitleHtml +
            '<div class="mt-1 flex flex-wrap items-center gap-x-3 gap-y-1 text-sm text-ink/70">' +
            '<span class="inline-flex items-center gap-2"><span class="h-2 w-2 rounded-full ' +
            dotClass +
            '" aria-hidden="true"></span>' +
            esc(evt.dateLabel) +
            '</span>' +
            timeHtml +
            '</div></div>' +
            '<a href="https://maps.google.com/?q=' +
            evt.mapQuery +
            '" target="_blank" rel="noreferrer" class="inline-flex items-center rounded-full bg-mist px-4 py-2 text-sm font-semibold text-ink hover:bg-stage-red/10 hover:text-stage-red">Ver mapa</a>' +
            '</div>' +
            '<div class="mt-3"><div class="text-xs font-semibold tracking-widest text-ink/60">UBICACIÓN</div>' +
            '<div class="mt-1 text-sm text-ink/80">' +
            esc(evt.venue) +
            '</div>' +
            '<div class="mt-1 text-sm text-ink/70">' +
            esc(evt.address) +
            '</div></div>' +
            noteHtml

          list.appendChild(article)
        }

        var groups = window.AQA_eventsForAgenda()
        groups.upcoming.forEach(function (evt) {
          renderEvent(evt, false)
        })
        if (groups.past.length) {
          var pastHeading = document.createElement('h2')
          pastHeading.className =
            'mt-8 border-t border-black/10 pt-6 font-serif text-lg font-semibold text-ink/70'
          pastHeading.textContent = 'Eventos pasados'
          list.appendChild(pastHeading)
          groups.past.forEach(function (evt) {
            renderEvent(evt, true)
          })
        }
      })()
    </script>
    <script src="./language-switcher.js"></script>
